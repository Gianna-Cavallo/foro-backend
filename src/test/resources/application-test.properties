# Perfil "test": base de datos H2 en memoria.
# Sobreescribe las claves de application.properties que apuntan a MySQL para
# que ningún test toque la base real. Se activa con @ActiveProfiles("test").

spring.datasource.url=jdbc:h2:mem:foro_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: crea el esquema al levantar el contexto y lo borra al cerrarlo.
spring.jpa.hibernate.ddl-auto=create-drop

# MySQLDialect no aplica a H2: hay que pisarlo explícitamente.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
